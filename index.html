<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NBTI 人格鉴定</title>

<meta property="og:title" content="NBTI人格鉴定">
<meta property="og:description" content="我测出来是____，你呢？">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧬</text></svg>">
<style>
:root{
  --bg:#f6faf6;--panel:#ffffff;--text:#1e2a22;--muted:#6a786f;
  --line:#dbe8dd;--soft:#edf6ef;--accent:#6c8d71;--accent-strong:#4d6a53;
  --shadow:0 16px 40px rgba(47,73,55,0.08);--radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at top left,#f8fff8 0,#f6faf6 36%,#f2f7f3 100%);
  color:var(--text);min-height:100vh;
}
.shell{max-width:540px;margin:0 auto;padding:24px 16px 56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.screen{display:none}.screen.active{display:block}
button{border:0;cursor:pointer;font:inherit;transition:transform .16s,box-shadow .16s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent-strong);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(77,106,83,.18);font-weight:700}
.btn-secondary{background:#fff;color:var(--accent-strong);padding:14px 20px;border-radius:14px;border:1px solid var(--line);font-weight:700}

/* ===== IP ===== */
.ip{width:100px;height:100px;margin:0 auto 16px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ===== HOME ===== */
.hero{padding:28px;margin-top:20px;overflow:hidden;position:relative;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:linear-gradient(180deg,rgba(127,165,134,.18),rgba(127,165,134,.02));pointer-events:none}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent-strong);border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:8px 14px;margin-bottom:16px;font-weight:700}
.hero h1{font-size:clamp(26px,6vw,44px);line-height:1.15;letter-spacing:-.02em;font-weight:900}
.hero h1 em{font-style:normal;color:var(--accent-strong)}
.hero .sub{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.75;max-width:360px}
.hero-actions{margin-top:28px;display:flex;gap:12px;justify-content:center}
.hero-footer{margin-top:28px;display:flex;flex-direction:column;font-size:12px;color:var(--muted);line-height:1.8}
.hero-footer a{color:var(--accent-strong);text-decoration:none;font-weight:600}

/* ===== QUIZ ===== */
.test-wrap{margin-top:22px;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.progress{flex:1;min-width:200px;height:10px;background:#edf3ee;border-radius:999px;overflow:hidden}
.progress>span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#97b59c,#5b7a62);transition:width .22s ease}
.progress-text{color:var(--muted);font-size:13px;white-space:nowrap}
.question-list{display:grid;gap:16px}
.question{border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#fbfdfb);transition:opacity .3s}
.question.answered{opacity:.45}
.question-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--soft);border:1px solid var(--line);font-weight:700;color:var(--accent-strong);font-size:11px}
.question-title{font-size:16px;line-height:1.7;white-space:pre-wrap}
.options{display:grid;gap:10px;margin-top:14px}
.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:all .16s;user-select:none;-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.5}
.option:active{transform:scale(.98)}
.option .ol{font-weight:800;color:var(--accent-strong);min-width:22px;flex-shrink:0}
.option.selected{border-color:var(--accent-strong);background:var(--soft)}
.actions-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.hint{color:var(--muted);font-size:13px;line-height:1.7}

/* ===== LOADING ===== */
.ld-wrap{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:42px 24px}
.ld-spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent-strong);animation:spin .7s linear infinite;margin:20px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-wrap b{color:var(--accent-strong);font-size:17px}
.ld-wrap p{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.6}

/* ===== RESULT ===== */
.result-wrap{margin-top:22px;padding:22px}
.result-layout{display:grid;gap:18px}
.result-top{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;align-items:stretch}
.rbox{border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#fbfdfb)}
.poster-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;position:relative;overflow:hidden;background:radial-gradient(circle at top right,rgba(127,165,134,.16),rgba(127,165,134,0) 40%),linear-gradient(180deg,#fff,#f7fbf8)}
.poster-box::after{content:"";position:absolute;right:-46px;bottom:-46px;width:140px;height:140px;border-radius:50%;background:linear-gradient(180deg,rgba(127,165,134,.12),rgba(127,165,134,.01));pointer-events:none}
.poster-emoji{font-size:72px;position:relative;z-index:1}
.poster-caption{margin-top:14px;color:var(--muted);font-size:14px;line-height:1.8;text-align:center;position:relative;z-index:1;font-style:italic}
.type-kicker{font-size:12px;color:var(--accent-strong);margin-bottom:8px;letter-spacing:.06em;font-weight:700}
.type-name{font-size:clamp(24px,5vw,40px);line-height:1.1;letter-spacing:-.03em;font-weight:900}
.type-subname{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.8}
.match{margin-top:16px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);color:var(--accent-strong);font-weight:700;font-size:14px}
.rbox h3{font-size:16px;margin-bottom:12px}
.rbox p{margin:0;color:#304034;font-size:15px;line-height:1.9;white-space:pre-wrap}
.dim-list{display:grid;gap:12px}
.dim-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.dim-item-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.dim-item-name{font-size:14px;font-weight:700}
.dim-item-score{color:var(--accent-strong);font-weight:800;font-size:14px}
.dim-item-hint{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.dim-bar{height:6px;border-radius:3px;background:#edf3ee;overflow:hidden}
.dim-bar>span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#97b59c,#5b7a62);transition:width .8s ease}
.note-box p{color:var(--muted);font-size:13px;line-height:1.8}
.result-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.footer-note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
@media(max-width:600px){.shell{padding:14px 12px 42px}.hero,.test-wrap,.result-wrap{padding:16px}.result-top{grid-template-columns:1fr}}
</style>
</head>

/* ---------- 引擎 ---------- */
var ans=[];
function calc(){
  var votes={};TYPES.forEach(function(t){votes[t.code]=0;});
  var sc={};DIMS.forEach(function(d){sc[d.id]=50;});
  ans.forEach(function(oi,qi){
    if(oi<0||qi>=QS.length)return;
    var o=QS[qi].opts[oi];if(!o||!o.s)return;
    Object.keys(o.s).forEach(function(k){
      if(sc[k]!==undefined) sc[k]=Math.max(0,Math.min(100,sc[k]+o.s[k]));
    });
  });
  return sc;
}
function match(sc){
  var best=null,bestCos=-2;
  var sv=[],smag=0;
  DIMS.forEach(function(dm){var v=(sc[dm.id]||50)-50;sv.push(v);smag+=v*v;});
  smag=Math.sqrt(smag)||1;
  TYPES.forEach(function(t){
    var dot=0,tmag=0;
    DIMS.forEach(function(dm,i){var tv=(t.v[dm.id]||50)-50;dot+=sv[i]*tv;tmag+=tv*tv;});
    tmag=Math.sqrt(tmag)||1;
    var cos=dot/(smag*tmag);
    if(cos>bestCos){bestCos=cos;best=t;}
  });
  var pct=Math.max(58,Math.min(96,Math.round(60+bestCos*36)));
  return{type:best,pct:pct};
}

/* ---------- 页面切换 ---------- */
function show(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ---------- 渲染题目 ---------- */
function renderQ(){
  var el=document.getElementById('qlist');el.innerHTML='';ans=[];
  for(var i=0;i<QS.length;i++){
    ans.push(-1);var q=QS[i];
    var d=document.createElement('div');d.className='question';d.id='qc'+i;
    var h='<div class="question-meta"><span class="badge">Q'+(i+1)+' / 30</span></div>';
    h+='<div class="question-title">'+q.q+'</div><div class="options">';
    var L=['A','B','C','D'];
    for(var j=0;j<q.opts.length;j++){
      h+='<div class="option" data-q="'+i+'" data-o="'+j+'" onclick="pick(this)">';
      h+='<span class="ol">'+L[j]+'</span><span>'+q.opts[j].t+'</span></div>';
    }
    h+='</div>';d.innerHTML=h;el.appendChild(d);
  }
  upd();
}
function pick(el){
  var qi=+el.getAttribute('data-q'),oi=+el.getAttribute('data-o');
  ans[qi]=oi;
  var c=document.getElementById('qc'+qi);
  var opts=c.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++)opts[i].classList.remove('selected');
  el.classList.add('selected');c.classList.add('answered');
  var nx=document.getElementById('qc'+(qi+1));
  if(nx)setTimeout(function(){nx.scrollIntoView({behavior:'smooth',block:'center'});},200);
  upd();
  if(ans.every(function(a){return a>=0;})){
    document.getElementById('submitBtn').disabled=false;
    document.getElementById('qhint').textContent='全部答完了！来，让系统看看你到底是什么货色。';
  }
}
function upd(){
  var done=ans.filter(function(a){return a>=0;}).length;
  var pct=Math.round(done/QS.length*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('ptext').textContent=done+' / '+QS.length;
}

/* ---------- 结果渲染 ---------- */
function showResult(){
  var sc=calc(),m=match(sc),t=m.type;
  var el=document.getElementById('rlayout');
  var h='<div class="result-top">';
  h+='<div class="poster-box rbox"><span class="poster-emoji">'+t.emoji+'</span>';
  h+='<div class="poster-caption">'+t.intro+'</div></div>';
  h+='<div class="type-box rbox"><div class="type-kicker">你的NPC属性</div>';
  h+='<div class="type-name">'+t.code+'（'+t.cn+'）</div>';
  h+='<div class="match">匹配度 '+m.pct+'%</div>';
  h+='<div class="type-subname">系统备注：建议本人照照镜子。</div></div></div>';

  h+='<div class="rbox"><h3>该人格的精神状态解读</h3><p>'+t.desc+'</p>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">';
  t.traits.forEach(function(tr){
    h+='<span style="padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--accent-strong)">'+tr+'</span>';
  });
  h+='</div></div>';

  h+='<div class="rbox"><h3>九维度属性面板</h3><div class="dim-list">';
  DIMS.forEach(function(d){
    var v=Math.max(0,Math.min(100,sc[d.id]||50));
    h+='<div class="dim-item"><div class="dim-item-top">';
    h+='<span class="dim-item-name">'+d.name+'</span>';
    h+='<span class="dim-item-score">'+v+' / 100</span></div>';
    h+='<div class="dim-item-hint"><span>'+d.lo+'</span><span>'+d.hi+'</span></div>';
    h+='<div class="dim-bar"><span style="width:'+v+'%"></span></div></div>';
  });
  h+='</div></div>';

  h+='<div class="rbox note-box"><h3>友情提示</h3>';
  h+='<p>本测试仅供娱乐，别拿它当诊断、面试、相亲、分手、算命或人生判决书。<br>但如果你觉得准——说明你确实是这种人，别挣扎了。</p></div>';
  el.innerHTML=h;
  document.getElementById('fnote').innerHTML='NBTI · NPC Behavioral Type Indicator · <b>@费率</b>';
  show('result');
}
