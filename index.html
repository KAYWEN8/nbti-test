<style>
:root{
  --bg:#f6faf6;--panel:#ffffff;--text:#1e2a22;--muted:#6a786f;
  --line:#dbe8dd;--soft:#edf6ef;--accent:#6c8d71;--accent-strong:#4d6a53;
  --shadow:0 16px 40px rgba(47,73,55,0.08);--radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:radial-gradient(circle at top left,#f8fff8 0,#f6faf6 36%,#f2f7f3 100%);
  color:var(--text);min-height:100vh;
}
.shell{max-width:540px;margin:0 auto;padding:24px 16px 56px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.screen{display:none}.screen.active{display:block}
button{border:0;cursor:pointer;font:inherit;transition:transform .16s,box-shadow .16s}
button:hover{transform:translateY(-1px)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent-strong);color:#fff;padding:14px 20px;border-radius:14px;box-shadow:0 12px 30px rgba(77,106,83,.18);font-weight:700}
.btn-secondary{background:#fff;color:var(--accent-strong);padding:14px 20px;border-radius:14px;border:1px solid var(--line);font-weight:700}
.ip{width:100px;height:100px;margin:0 auto 16px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero{padding:28px;margin-top:20px;overflow:hidden;position:relative;min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:linear-gradient(180deg,rgba(127,165,134,.18),rgba(127,165,134,.02));pointer-events:none}
.hero h1{font-size:clamp(26px,6vw,44px);line-height:1.15;letter-spacing:-.02em;font-weight:900}
.hero h1 em{font-style:normal;color:var(--accent-strong)}
.hero .sub{margin-top:14px;color:var(--muted);font-size:15px;line-height:1.75;max-width:360px}
.hero-actions{margin-top:28px;display:flex;gap:12px;justify-content:center}
.test-wrap{margin-top:22px;padding:22px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.progress{flex:1;min-width:200px;height:10px;background:#edf3ee;border-radius:999px;overflow:hidden}
.progress>span{display:block;width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#97b59c,#5b7a62);transition:width .22s ease}
.progress-text{color:var(--muted);font-size:13px;white-space:nowrap}
.question-list{display:grid;gap:16px}
.question{border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#fbfdfb);transition:opacity .3s}
.question.answered{opacity:.45}
.question-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 10px;background:var(--soft);border:1px solid var(--line);font-weight:700;color:var(--accent-strong);font-size:11px}
.question-title{font-size:16px;line-height:1.7;white-space:pre-wrap}
.options{display:grid;gap:10px;margin-top:14px}
.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:all .16s;user-select:none;-webkit-tap-highlight-color:transparent;font-size:14px;line-height:1.5}
.option:active{transform:scale(.98)}
.option .ol{font-weight:800;color:var(--accent-strong);min-width:22px;flex-shrink:0}
.option.selected{border-color:var(--accent-strong);background:var(--soft)}
.actions-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}
.hint{color:var(--muted);font-size:13px;line-height:1.7}
.ld-wrap{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:42px 24px}
.ld-spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent-strong);animation:spin .7s linear infinite;margin:20px 0}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-wrap b{color:var(--accent-strong);font-size:17px}
.ld-wrap p{color:var(--muted);font-size:14px;margin-top:6px;line-height:1.6}
.result-wrap{margin-top:22px;padding:22px}
.result-layout{display:grid;gap:18px}
.result-top{display:grid;grid-template-columns:.9fr 1.1fr;gap:18px;align-items:stretch}
.rbox{border:1px solid var(--line);border-radius:18px;padding:18px;background:linear-gradient(180deg,#fff,#fbfdfb)}
.poster-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:220px;position:relative;overflow:hidden;background:radial-gradient(circle at top right,rgba(127,165,134,.16),rgba(127,165,134,0) 40%),linear-gradient(180deg,#fff,#f7fbf8)}
.poster-box::after{content:"";position:absolute;right:-46px;bottom:-46px;width:140px;height:140px;border-radius:50%;background:linear-gradient(180deg,rgba(127,165,134,.12),rgba(127,165,134,.01));pointer-events:none}
.poster-emoji{font-size:72px;position:relative;z-index:1}
.poster-caption{margin-top:14px;color:var(--muted);font-size:14px;line-height:1.8;text-align:center;position:relative;z-index:1;font-style:italic}
.type-kicker{font-size:12px;color:var(--accent-strong);margin-bottom:8px;letter-spacing:.06em;font-weight:700}
.type-name{font-size:clamp(22px,5vw,36px);line-height:1.15;letter-spacing:-.03em;font-weight:900}
.type-subname{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.8}
.match{margin-top:16px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;background:var(--soft);border:1px solid var(--line);color:var(--accent-strong);font-weight:700;font-size:14px}
.rbox h3{font-size:16px;margin-bottom:12px}
.rbox p{margin:0;color:#304034;font-size:15px;line-height:1.9;white-space:pre-wrap}
.dim-list{display:grid;gap:12px}
.dim-item{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.dim-item-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.dim-item-name{font-size:14px;font-weight:700}
.dim-item-score{color:var(--accent-strong);font-weight:800;font-size:14px}
.dim-item-hint{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.dim-bar{height:6px;border-radius:3px;background:#edf3ee;overflow:hidden}
.dim-bar>span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#97b59c,#5b7a62);transition:width .8s ease}
.note-box p{color:var(--muted);font-size:13px;line-height:1.8}
.result-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.footer-note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.7;text-align:center}
.poster-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:rgba(0,0,0,.75);justify-content:center;align-items:center;flex-direction:column;padding:20px}
.poster-overlay.show{display:flex}
.poster-overlay canvas{max-width:92vw;max-height:75vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.poster-overlay .poster-tip{color:#fff;font-size:14px;margin-top:16px;text-align:center;line-height:1.8;opacity:.85}
.poster-overlay .poster-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;cursor:pointer;background:none;border:none;opacity:.7}
.poster-overlay .poster-close:hover{opacity:1}
.btn-share{background:linear-gradient(135deg,#5b7a62,#3d5a44);color:#fff;border:none;padding:12px 24px;border-radius:24px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.5px}
.btn-share:active{transform:scale(.96)}
.dim-section-title{font-size:13px;font-weight:700;color:var(--accent-strong);margin-bottom:6px;padding:6px 12px;background:var(--soft);border-radius:10px;display:inline-block}
@media(max-width:600px){.shell{padding:14px 12px 42px}.hero,.test-wrap,.result-wrap{padding:16px}.result-top{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">

<!-- ===== HOME ===== -->
<section id="intro" class="screen active">
  <div class="hero card">

<!-- ===== QUIZ ===== -->
<section id="test" class="screen">

    <div class="question-list" id="qlist"></div>
    <div class="actions-bottom">
      <span class="hint" id="qhint">选完所有题后才能提交哦</span>
      <div style="display:flex;gap:10px">
        <button class="btn-secondary" id="backBtn">返回</button>
        <button class="btn-primary" id="submitBtn" disabled>提交鉴定</button>
      </div>

</section>

<!-- ===== LOADING ===== -->
<section id="loading" class="screen">
  <div class="ld-wrap card">

    <p>正在分析你的31个灵魂选择…<br>系统正在翻阅你的NPC档案…</p>

</section>

<!-- ===== RESULT ===== -->
<section id="result" class="screen">
  <div class="result-wrap card">
    <div class="result-layout" id="rlayout"></div>
    <div class="result-actions">
      <div style="display:flex;gap:12px;flex-wrap:wrap">

        <button class="btn-secondary" id="retryBtn">重新鉴定</button>
        <button class="btn-primary" id="homeBtn">回到首页</button>
      </div>
    </div>
  </div>
  <div class="footer-note" id="fnote"></div>
</section>

</div>

<div class="poster-overlay" id="posterOverlay">
  <button class="poster-close" id="posterClose">&times;</button>

</div>

<script>
/* ============================================================
   NBTI 人格鉴定 · 31题完整版

/* ---------- 3个维度 ---------- */
var DIMS=[
  {id:'d1',name:'社会毒性指数',lo:'人间清醒',hi:'人间毒瘤',range:[1,10]},
  {id:'d2',name:'社交NPC等级',lo:'万人迷体质',hi:'社恐终极体'},

];

/* ---------- 18个人格（按总分从高到低） ---------- */
var RANKS=[
  {min:150,max:155,title:'人间活菩萨',img:'images/1.png',
   sub:'自带福报光环，随手帮人，自带好运',
   desc:'朋友见了都想抱大腿：你是我唯一的神。你的善良不是装出来的，是骨子里自带的光环。走到哪都有人喜欢你，做什么都顺风顺水。阎王看了你的档案直接划掉名字——这种人不配进地府。',
   traits:['#自带福报','#行走的许愿池','#人间值得','#万人迷体质']},
  {min:144,max:149,title:'天命锦鲤人',img:'images/2.png',
   sub:'干啥都顺，踩坑都能踩出元宝',
   desc:'阎王见了绕道走，财神天天上门打卡。你就是那种"出门踩狗屎都能中彩票"的体质。不是你有多努力，是老天爷硬要追着给你开挂。身边人都说：跟你待一起运气都能沾上。',
   traits:['#锦鲤本鲤','#踩坑出元宝','#全服最欧','#天选之子']},
  {min:138,max:143,title:'盛世功德体',img:'images/3.png',
   sub:'情绪稳定、情商拉满、从不内耗',
   desc:'自带治愈 buff，跟你待着就舒服。你是那种"吵架都吵不起来"的存在——不是因为怂，是因为太通透了。身边人有情绪第一个想找你，因为你的存在本身就是一剂安慰剂。',
   traits:['#情绪稳定器','#零内耗','#人间安慰剂','#通透本透']},
  {min:131,max:137,title:'社交仙人',img:'images/4.png',
   sub:'走到哪都受欢迎，没人讨厌你',
   desc:'吵架都能把对方哄开心。你的社交天赋是天生的，不用学也不用装。聚会有你不冷场，干活有你不塌方。你就是传说中"谁都想组队的那个人"。',
   traits:['#社交天花板','#哄人大师','#氛围担当','#全员团宠']},
  {min:124,max:130,title:'靠谱守护神',img:'images/5.png',
   sub:'答应必做，遇事必顶',
   desc:'朋友心中永远的最稳靠山。你不是最闪耀的那个，但绝对是最让人安心的那个。说到做到、从不画饼、遇事不慌。大家不一定天天想到你，但出事第一个想到的一定是你。',
   traits:['#答应必做','#人间定海针','#靠谱本谱','#安全感代名词']},
  {min:117,max:123,title:'快乐制造机',img:'images/6.png',
   sub:'自带笑点，跟你在一起不会 emo',
   desc:'气氛组祖师爷，人间小太阳。你的存在就是一个行走的快乐源泉——不需要刻意搞笑，你站在那里就是个段子。朋友emo的时候找你聊五分钟就能满血复活。',
   traits:['#快乐源泉','#气氛组YYDS','#人间小太阳','#emo终结者']},

   traits:['#行走的debuff','#倒霉传染源','#组队必翻','#安全距离1米']},
  {min:68,max:74,title:'怨种倒霉蛋',img:'images/13.png',
   sub:'总被坑、总被骗、总当垫脚石',

/* ---------- 引擎 ---------- */
var ans=[];
function calc(){
  var total=0;
  var dimScores={d1:0,d2:0,d3:0};
  var dimCounts={d1:0,d2:0,d3:0};
  ans.forEach(function(oi,qi){
    if(oi<0||qi>=QS.length)return;
    var pts=5-oi;
    total+=pts;
    var dm=QS[qi].dim;
    dimScores[dm]+=pts;
    dimCounts[dm]++;
  });
  return{total:total,dimScores:dimScores,dimCounts:dimCounts};
}
function match(res){
  var t=res.total;
  for(var i=0;i<RANKS.length;i++){
    if(t>=RANKS[i].min) return RANKS[i];
  }
  return RANKS[RANKS.length-1];
}

/* ---------- 页面切换 ---------- */
function show(id){
  var ss=document.querySelectorAll('.screen');
  for(var i=0;i<ss.length;i++)ss[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ---------- 渲染题目 ---------- */
function renderQ(){
  var el=document.getElementById('qlist');el.innerHTML='';ans=[];
  var dimLabels={d1:'维度一 · 做人底线',d2:'维度二 · 社交段位',d3:'维度三 · 精神状态'};
  var lastDim='';
  for(var i=0;i<QS.length;i++){
    ans.push(-1);var q=QS[i];
    if(q.dim!==lastDim){
      var sec=document.createElement('div');
      sec.innerHTML='<span class="dim-section-title">'+dimLabels[q.dim]+'</span>';
      el.appendChild(sec);
      lastDim=q.dim;
    }
    var d=document.createElement('div');d.className='question';d.id='qc'+i;
    var h='<div class="question-meta"><span class="badge">Q'+(i+1)+' / 31</span></div>';
    h+='<div class="question-title">'+q.q+'</div><div class="options">';
    var L=['A','B','C','D','E'];
    for(var j=0;j<q.opts.length;j++){
      h+='<div class="option" data-q="'+i+'" data-o="'+j+'" onclick="pick(this)">';
      h+='<span class="ol">'+L[j]+'</span><span>'+q.opts[j].t+'</span></div>';
    }
    h+='</div>';d.innerHTML=h;el.appendChild(d);
  }
  upd();
}
function pick(el){
  var qi=+el.getAttribute('data-q'),oi=+el.getAttribute('data-o');
  ans[qi]=oi;
  var c=document.getElementById('qc'+qi);
  var opts=c.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++)opts[i].classList.remove('selected');
  el.classList.add('selected');c.classList.add('answered');
  var nx=document.getElementById('qc'+(qi+1));
  if(nx)setTimeout(function(){nx.scrollIntoView({behavior:'smooth',block:'center'});},200);
  upd();
  if(ans.every(function(a){return a>=0;})){
    document.getElementById('submitBtn').disabled=false;
    document.getElementById('qhint').textContent='全部答完了！来，让系统看看你到底什么段位。';
  }
}
function upd(){
  var done=ans.filter(function(a){return a>=0;}).length;
  var pct=Math.round(done/QS.length*100);
  document.getElementById('bar').style.width=pct+'%';
  document.getElementById('ptext').textContent=done+' / '+QS.length;
}

/* ---------- 结果渲染 ---------- */
var _lastResult=null;
function showResult(){
  var res=calc(),rank=match(res);
  var ds=res.dimScores,dc=res.dimCounts;
  _lastResult={rank:rank,total:res.total,ds:ds,dc:dc};

  var el=document.getElementById('rlayout');
  var h='<div class="result-top">';
  h+='<div class="poster-box rbox"><img src="'+rank.img+'" alt="'+rank.title+'" style="width:140px;height:auto;position:relative;z-index:1">';
  h+='<div class="poster-caption">'+rank.sub+'</div></div>';
  h+='<div class="type-box rbox"><div class="type-kicker">你的NPC段位</div>';
  h+='<div class="type-name">'+rank.title+'</div>';
  h+='<div class="match">总分 '+res.total+' / 155</div>';
  h+='<div class="type-subname">分数范围：'+rank.min+'–'+rank.max+'分</div></div></div>';

  h+='<div class="rbox"><h3>段位详细解读</h3><p>'+rank.desc+'</p>';
  h+='<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">';
  rank.traits.forEach(function(tr){
    h+='<span style="padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--accent-strong)">'+tr+'</span>';
  });
  h+='</div></div>';

  h+='<div class="rbox"><h3>三维度得分面板</h3><div class="dim-list">';
  var dimMeta=[
    {id:'d1',name:'做人底线',lo:'人间毒瘤',hi:'人间清醒',max:50},
    {id:'d2',name:'社交段位',lo:'社恐到爆',hi:'万人迷',max:50},
    {id:'d3',name:'精神状态',lo:'随时爆炸',hi:'心态大师',max:55}
  ];
  dimMeta.forEach(function(d){
    var v=ds[d.id]||0;
    var pct=Math.round(v/d.max*100);
    h+='<div class="dim-item"><div class="dim-item-top">';
    h+='<span class="dim-item-name">'+d.name+'</span>';
    h+='<span class="dim-item-score">'+v+' / '+d.max+'</span></div>';
    h+='<div class="dim-item-hint"><span>'+d.lo+'</span><span>'+d.hi+'</span></div>';
    h+='<div class="dim-bar"><span style="width:'+pct+'%"></span></div></div>';
  });
  h+='</div></div>';

  h+='<div class="rbox note-box"><h3>友情提示</h3>';
  h+='<p>本测试纯属娱乐，别拿它当人生判决书。<br>但如果你的分低到离谱……建议照照镜子反思一下。</p></div>';

  h+='<div style="margin-top:20px;padding:18px 20px;background:#f5f9f6;border-radius:16px;border:1px solid var(--line);text-align:center;line-height:2.2;font-size:13px;color:var(--muted)">';
  h+='<div style="font-weight:700;color:var(--accent-strong);font-size:14px;margin-bottom:4px">NBTI · NPC Behavioral Type Indicator</div>';
  h+='<div>原作者：<a href="https://v.douyin.com/ZQ0bwJz4V0c/" target="_blank" style="color:#1e80ff;text-decoration:none;font-weight:600">DOU音@羊肉蛋汤</a></div>';
  h+='<div>托管：Cloudflare (免费)&emsp;·&emsp;域名：spansoda.cn (自费)</div>';
  h+='</div>';

  el.innerHTML=h;
  document.getElementById('fnote').textContent='';
  show('result');
}

/* ---------- 海报生成 ---------- */
function genPoster(){
  if(!_lastResult)return;
  var r=_lastResult.rank, total=_lastResult.total, ds=_lastResult.ds;
  var W=750, H=1334;
  var cvs=document.getElementById('posterCanvas');
  cvs.width=W; cvs.height=H;
  var ctx=cvs.getContext('2d');

  var grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,'#e8f0e9'); grd.addColorStop(0.5,'#f5f9f6'); grd.addColorStop(1,'#dce8de');
  ctx.fillStyle=grd; ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#fff'; roundRect(ctx,40,40,W-80,H-80,24); ctx.fill();
  ctx.strokeStyle='#d0ddd3'; ctx.lineWidth=1.5; roundRect(ctx,40,40,W-80,H-80,24); ctx.stroke();

  ctx.fillStyle='#2d3a30'; ctx.font='bold 28px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.fillText('NBTI · NPC段位鉴定',W/2,110);

  ctx.fillStyle='#8a9e8f'; ctx.font='16px system-ui,sans-serif';
  ctx.fillText('31道灵魂拷问 · ABCDE五档鉴定',W/2,145);

  var drawAfterImg=function(){
  ctx.fillStyle='#1e2a22'; ctx.font='bold 32px system-ui,sans-serif';
  ctx.textAlign='center';
  var titleLines=wrapText(ctx,r.title,W-160);
  var ty=370;
  titleLines.forEach(function(ln){ctx.fillText(ln,W/2,ty);ty+=40;});

  roundRect(ctx,W/2-100,ty+10,200,44,22);
  ctx.fillStyle='#edf5ee'; ctx.fill();
  ctx.strokeStyle='#b8d8ba'; ctx.lineWidth=1; roundRect(ctx,W/2-100,ty+10,200,44,22); ctx.stroke();
  ctx.fillStyle='#3d5a44'; ctx.font='bold 18px system-ui,sans-serif';
  ctx.fillText('总分 '+total+' / 155',W/2,ty+38);

  ctx.font='italic 15px system-ui,sans-serif'; ctx.fillStyle='#7a8e7f';
  ctx.fillText('"'+r.sub+'"',W/2,ty+90);

  var dimY=ty+130;
  ctx.textAlign='left';
  ctx.fillStyle='#3d5a44'; ctx.font='bold 18px system-ui,sans-serif';
  ctx.fillText('三维度得分',80,dimY); dimY+=12;

  var dimMeta=[
    {id:'d1',name:'做人底线',max:50},
    {id:'d2',name:'社交段位',max:50},
    {id:'d3',name:'精神状态',max:55}
  ];
  var barW=440, barH=16, barX=180;
  dimMeta.forEach(function(d){
    dimY+=36;
    var v=ds[d.id]||0;
    var pct=v/d.max;
    ctx.fillStyle='#4a5e4e'; ctx.font='bold 15px system-ui,sans-serif'; ctx.textAlign='right';
    ctx.fillText(d.name,barX-14,dimY+5);
    roundRect(ctx,barX,dimY-8,barW,barH,8);
    ctx.fillStyle='#edf3ee'; ctx.fill();
    var fillW=Math.max(barH,barW*pct);
    roundRect(ctx,barX,dimY-8,fillW,barH,8);
    var bGrd=ctx.createLinearGradient(barX,0,barX+fillW,0);
    bGrd.addColorStop(0,'#97b59c'); bGrd.addColorStop(1,'#5b7a62');
    ctx.fillStyle=bGrd; ctx.fill();
    ctx.fillStyle='#5b7a62'; ctx.font='bold 14px system-ui,sans-serif'; ctx.textAlign='left';
    ctx.fillText(v+'/'+d.max,barX+barW+10,dimY+5);
  });

  var tagY=dimY+50;
  ctx.textAlign='center';
  var tagsPerRow=2, tagGap=12, tagH=34;
  var totalTagW=W-160;
  var singleTagW=(totalTagW-tagGap*(tagsPerRow-1))/tagsPerRow;
  r.traits.forEach(function(tr,i){
    var row=Math.floor(i/tagsPerRow), col=i%tagsPerRow;
    var tx=80+col*(singleTagW+tagGap);
    var tty=tagY+row*(tagH+10);
    roundRect(ctx,tx,tty,singleTagW,tagH,17);
    ctx.fillStyle='#edf5ee'; ctx.fill();
    ctx.strokeStyle='#c5ddc8'; ctx.lineWidth=1; roundRect(ctx,tx,tty,singleTagW,tagH,17); ctx.stroke();
    ctx.fillStyle='#3d5a44'; ctx.font='bold 13px system-ui,sans-serif';
    ctx.fillText(tr,tx+singleTagW/2,tty+22);
  });

  var footY=H-120;
  ctx.fillStyle='#c5ddc8'; ctx.fillRect(80,footY,W-160,1);
  ctx.fillStyle='#8a9e8f'; ctx.font='14px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.fillText('扫码或访问测你的NPC段位',W/2,footY+30);
  ctx.fillStyle='#5b7a62'; ctx.font='bold 16px system-ui,sans-serif';
  ctx.fillText('nbti.coco.dev',W/2,footY+56);
  ctx.fillStyle='#b0c4b4'; ctx.font='12px system-ui,sans-serif';
  ctx.fillText('原作者：DOU音@羊肉蛋汤',W/2,footY+82);

  document.getElementById('posterOverlay').classList.add('show');
  };

  var img=new Image();
  img.onload=function(){
    ctx.save();
    var iw=140,ih=140*(img.height/img.width);
    ctx.drawImage(img,W/2-iw/2,180,iw,ih);
    ctx.restore();
    drawAfterImg();
  };
  img.onerror=function(){
    ctx.font='72px system-ui,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#000'; ctx.fillText('🎭',W/2,265);
    drawAfterImg();
  };
  img.src=r.img;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function wrapText(ctx,text,maxW){
  var lines=[],line='';
  for(var i=0;i<text.length;i++){
    var test=line+text[i];
    if(ctx.measureText(test).width>maxW&&line.length>0){lines.push(line);line=text[i];}
    else line=test;
  }
  if(line)lines.push(line);
  return lines;
}

document.getElementById('backBtn').onclick=function(){show('intro');};

document.getElementById('retryBtn').onclick=function(){show('test');renderQ();};
document.getElementById('homeBtn').onclick=function(){show('intro');};
document.getElementById('shareBtn').onclick=genPoster;
document.getElementById('posterClose').onclick=function(){document.getElementById('posterOverlay').classList.remove('show');};
document.getElementById('posterOverlay').onclick=function(e){if(e.target===this)this.classList.remove('show');};
</script>
